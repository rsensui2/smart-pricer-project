<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマート・プライサー | 自然の恵みを、まっすぐ届ける</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F9F7F2;
            --primary-color: #6B8E23;
            /* オリーブドラブ */
            --accent-color: #A0522D;
            /* シエナ */
            --text-color: #4A4A4A;
            --font-family: 'Kiwi Maru', serif;
        }

        body {
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
        }

        header {
            padding: 2rem;
            text-align: center;
            background-color: #fff;
        }

        .logo {
            font-size: 1.5rem;
            color: var(--primary-color);
            letter-spacing: 0.1rem;
        }

        .hero {
            position: relative;
            padding: 4rem 2rem;
            text-align: center;
        }

        .hero-inner {
            max-width: 900px;
            margin: 0 auto;
        }

        .hero img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .lead {
            font-size: 1.1rem;
            margin-bottom: 3rem;
            color: #666;
        }

        .btn-organic {
            display: inline-block;
            padding: 1rem 3rem;
            background-color: var(--primary-color);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            transition: opacity 0.3s;
        }

        .btn-organic:hover {
            opacity: 0.8;
        }

        .section {
            padding: 4rem 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background-color: #fff;
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            border: 1px solid #EFEBE5;
        }

        .card-title {
            color: var(--primary-color);
            font-size: 1.2rem;
            margin-bottom: 1rem;
            display: block;
        }

        footer {
            padding: 4rem 2rem;
            text-align: center;
            background-color: #EFEBE5;
            color: #8D8273;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">Smart Pricer Organic</div>
    </header>

    <div class="hero">
        <div class="hero-inner">
            <img src="images/hero_c1.png" alt="Organic Market in Forest">
            <h1>土の香りを、そのまま価格に。</h1>
            <p class="lead">大切に育てた野菜だから、値付けも丁寧に、心穏やかに。<br>
                計算の手間を省いて、。野菜の物語を語る時間を増やしましょう。</p>
            <a href="#" class="btn-organic">穏やかに始める</a>
        </div>
    </div>

    <div class="section">
        <div class="card">
            <span class="card-title">自然な操作感</span>
            <p>スマホで撮るだけで、あらかじめ決めた「優しさの比率」で売値を提案。迷う時間はもうありません。</p>
        </div>
        <div class="card">
            <span class="card-title">繋がる想い</span>
            <p>空いた時間で、お客様に今日の収穫の話を。スマート・プライサーは、。商売の「心」を支えます。</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Smart Pricer Organic. たゆたう時間に、確かな商いを。</p>
    </footer>
</body>

</html>
