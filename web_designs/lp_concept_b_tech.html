<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pricer | 次世代のリテール・オペレーション</title>
    <meta name="description" content="AIが導き出す「勝てる価格」。経験則をデータに変え、利益最大化を実現するプライシング・プラットフォーム。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F172A;
            /* ダークネイビー */
            --card-bg: #1E293B;
            --primary-accent: #00E5FF;
            /* サイバーブルー */
            --secondary-accent: #00FF9D;
            /* ネオングリーン */
            --text-color: #F8FAFC;
            --text-muted: #94A3B8;
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 1.2rem;
            letter-spacing: 2px;
            font-weight: 800;
            color: var(--primary-accent);
            text-transform: uppercase;
        }

        .hero {
            padding: 4rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: 50%;
            transform: translate(-50%, 0);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.2) 0%, rgba(15, 23, 42, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .tagline {
            color: var(--secondary-accent);
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            display: inline-block;
            border: 1px solid var(--secondary-accent);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
        }

        h1 {
            font-size: 3rem;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            background: linear-gradient(90deg, #FFFFFF, #94A3B8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.lead {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 3rem;
        }

        .hero-image-wrapper {
            margin-top: 2rem;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
        }

        .hero-image {
            width: 100%;
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            padding: 4rem 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-accent);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-accent);
            display: block;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .cta-section {
            text-align: center;
            padding: 2rem;
            margin-bottom: 4rem;
        }

        .primary-btn {
            background: linear-gradient(90deg, var(--primary-accent), #00B0FF);
            color: #000;
            padding: 1rem 2.5rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            display: inline-block;
            transition: box-shadow 0.3s;
        }

        .primary-btn:hover {
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Smart Pricer // AI</div>
        <div style="font-size: 0.9rem; color: var(--text-muted);">v2.0 Beta</div>
    </header>

    <div class="hero">
        <div class="hero-content">
            <span class="tagline">RETAIL INTELLIGENCE</span>
            <h1>3秒で終わる、<br>最強のプライシング。</h1>
            <p class="lead">スキャンするだけで、ビッグデータに基づく「勝てる価格」を瞬時に算出。<br>
                感覚に頼る時代は終わりました。</p>

            <a href="#" class="primary-btn">Start Free Trial</a>

            <div class="hero-image-wrapper">
                <img src="images/hero_b.png" alt="Futuristic smartphone interface analysing vegetable prices"
                    class="hero-image">
            </div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-number">60%</span>
            <span class="stat-label">時間削減率</span>
        </div>
        <div class="stat-card">
            <span class="stat-number">+12%</span>
            <span class="stat-label">粗利益改善</span>
        </div>
        <div class="stat-card">
            <span class="stat-number">0.3s</span>
            <span class="stat-label">AI応答速度</span>
        </div>
    </div>

    <footer
        style="text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid rgba(255,255,255,0.1);">
        <p>POWERED BY NEURAL ENGINE X</p>
    </footer>

</body>

</html>
